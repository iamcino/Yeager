name: VirusTotal reference
on:
  release:
    types: [published]
permissions:
  contents: write                   # upload asset lên release
concurrency:
  group: vt-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Download signed assets + checksums
        run: |
          gh release download "${{ env.RELEASE_TAG }}" -D dl
        env: { GH_TOKEN: ${{ github.token }} }

      - name: Verify integrity then scan
        id: scan
        run: |
          set +e
          if [ -z "$VT_API_KEY" ]; then
            echo '{"status":"skipped","reason":"no VT_API_KEY"}' > vt.json
            echo "should_upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Cross-check toan bo hash truoc khi gui bat ky file nao len VT
          ( cd dl && sha256sum -c SHA256SUMS.txt )
          if [ $? -ne 0 ]; then
            echo '{"status":"integrity_mismatch"}' > vt.json
            echo "should_upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - <<'PY'
          import os, glob, json, time, datetime, subprocess, urllib.request

          KEY = os.environ["VT_API_KEY"]
          TAG = os.environ["RELEASE_TAG"]
          DEADLINE_SECONDS = 1200.0  # 20 minutes total job deadline
          start_time = time.time()
          _last = 0.0

          def throttle():
              global _last
              wait = 45.0 - (time.time() - _last)
              if wait > 0:
                  time.sleep(wait)
              _last = time.time()

          def iso_utc(ts):
              if not ts:
                  return None
              try:
                  return datetime.datetime.fromtimestamp(int(ts), datetime.timezone.utc).isoformat().replace("+00:00", "Z")
              except Exception:
                  return None

          def api(m, u, data=None, raw=None):
              throttle()
              r = urllib.request.Request(
                  f"https://www.virustotal.com/api/v3{u}",
                  method=m,
                  headers={"x-apikey": KEY},
                  data=data if raw is None else raw
              )
              if raw:
                  r.add_header("Content-Type", "application/octet-stream")
              return json.load(urllib.request.urlopen(r))

          OUT = {}
          pending_analyses = []

          # Scope: binary executables (.exe)
          for f in sorted(glob.glob("dl/*.exe")):
              sha = subprocess.check_output(["sha256sum", f]).split()[0].decode()
              link = f"https://www.virustotal.com/gui/file/{sha}"
              fname = os.path.basename(f)

              if time.time() - start_time >= DEADLINE_SECONDS:
                  OUT[fname] = {
                      "sha256": sha,
                      "link": link,
                      "status": "pending",
                      "note": "Deadline exceeded before file submission"
                  }
                  continue

              try:
                  aid = api("POST", "/files", raw=open(f, "rb").read())["data"]["id"]
                  OUT[fname] = {
                      "sha256": sha,
                      "link": link,
                      "status": "pending"
                  }
                  pending_analyses.append((fname, sha, aid))
              except Exception as e:
                  OUT[fname] = {
                      "sha256": sha,
                      "link": link,
                      "status": "submit_failed",
                      "error": str(e)
                  }

          # Polling loop bounded strictly by overall 20-minute job deadline
          while pending_analyses and (time.time() - start_time < DEADLINE_SECONDS):
              still_pending = []
              for fname, sha, aid in pending_analyses:
                  if time.time() - start_time >= DEADLINE_SECONDS:
                      still_pending.append((fname, sha, aid))
                      continue

                  try:
                      d = api("GET", f"/analyses/{aid}")["data"]["attributes"]
                      status = d.get("status")
                  except Exception:
                      still_pending.append((fname, sha, aid))
                      continue

                  if status == "completed":
                      stats = None
                      last_analysis_date = None
                      try:
                          finfo = api("GET", f"/files/{sha}")["data"]["attributes"]
                          stats = finfo.get("last_analysis_stats")
                          epoch = finfo.get("last_analysis_date")
                          if epoch:
                              last_analysis_date = iso_utc(epoch)
                      except Exception:
                          pass

                      OUT[fname]["status"] = "completed"
                      if last_analysis_date:
                          OUT[fname]["last_analysis_date"] = last_analysis_date
                      if stats:
                          OUT[fname]["stats"] = stats
                  else:
                      still_pending.append((fname, sha, aid))

              if len(still_pending) == len(pending_analyses):
                  time.sleep(5)
              pending_analyses = still_pending

          payload = {
              "version": TAG,
              "scope": "executable_binaries",
              "scope_note": "Only executable binaries (.exe) are submitted for VirusTotal analysis; portable .zip contains identical bit-for-bit yeager.exe and is verified via SHA256SUMS.txt.",
              "generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
              "results": OUT
          }
          with open("vt.json", "w", encoding="utf-8") as fp:
              json.dump(payload, fp, indent=2)
          PY

          cat vt.json >> "$GITHUB_STEP_SUMMARY"

          # Quyet dinh upload: chi upload khi co it nhat 1 file completed hoac pending
          SHOULD_UPLOAD=$(python3 -c '
          import json
          try:
              data = json.load(open("vt.json"))
              results = data.get("results", {})
              valid = any(v.get("status") in ("completed", "pending") for v in results.values())
              print("true" if valid else "false")
          except Exception:
              print("false")
          ')
          echo "should_upload=$SHOULD_UPLOAD" >> "$GITHUB_OUTPUT"

      - name: Attach reference asset to release
        if: steps.scan.outputs.should_upload == 'true'
        run: |
          cp vt.json "virustotal-${{ env.RELEASE_TAG }}.json"
          gh release upload "${{ env.RELEASE_TAG }}" \
            "virustotal-${{ env.RELEASE_TAG }}.json" --clobber
        env: { GH_TOKEN: ${{ github.token }} }
