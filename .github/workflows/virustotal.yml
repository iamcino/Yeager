name: VirusTotal reference

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to scan
        required: false

permissions:
  contents: write

jobs:
  scan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.workflow_run.head_branch }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="${{ inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --json tagName --jq .tagName)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download signed assets + checksums
        if: steps.rel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" -D dl

      - name: Verify integrity then scan
        id: scan
        if: steps.rel.outputs.tag != ''
        run: |
          set +e
          if [ -z "$VT_API_KEY" ]; then
            echo '{"status":"skipped","reason":"no VT_API_KEY"}' > vt.json
            echo "should_upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Cross-check toan bo hash truoc khi gui bat ky file nao len VT
          ( cd dl && sha256sum -c SHA256SUMS.txt )
          if [ $? -ne 0 ]; then
            echo '{"status":"integrity_mismatch"}' > vt.json
            echo "should_upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 tools/virustotal/scan.py
          cat vt.json >> "$GITHUB_STEP_SUMMARY"

          SHOULD_UPLOAD=$(python3 -c '
          import json
          try:
              data = json.load(open("vt.json"))
              results = data.get("results", {})
              valid = any(v.get("status") in ("completed", "pending") for v in results.values())
              print("true" if valid else "false")
          except Exception:
              print("false")
          ')
          echo "should_upload=$SHOULD_UPLOAD" >> "$GITHUB_OUTPUT"

      - name: Attach reference asset to release
        if: steps.scan.outputs.should_upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp vt.json "virustotal-${RELEASE_TAG}.json"
          gh release upload "$RELEASE_TAG" \
            "virustotal-${RELEASE_TAG}.json" --clobber
