# Yeager on GitLab.
#
# Runs on the self-hosted Windows runner tagged "yeager-windows" (Garen-PC, shell executor,
# PowerShell, running as LocalSystem; it also builds EasyKey). The runner needs the Visual
# Studio C++ build tools, Inno Setup 6+ and the Windows SDK (signtool). Rust is installed by
# the job itself into <runner folder>\rust the first time, so it does not depend on any
# user's profile.
#
# check    every push and merge request: tests and a release build.
# release  build, sign, installer, package and publish through tools/release-gitlab.ps1.
#          Only run by hand, on master or a version tag; it never fails the pipeline.
#          Releases are normally made from a developer machine with the same script
#          (see docs/BUILD.md).
#
# Protected CI/CD variables used by the release job (Settings > CI/CD > Variables):
#   CODESIGN_PFX_BASE64    the signing PFX, base64 (masked, protected)
#   CODESIGN_PFX_PASSWORD  its password (masked, protected)
#   GITLAB_TOKEN           optional; only if the job token may not create releases
#
# levi ships no binary of its own: the package is left out of the release build and
# never ships, but its tests DO run in the check job below (cargo test -p levi).

stages: [test, release]

default:
  tags: [yeager-windows]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

variables:
  GIT_DEPTH: "0"
  CARGO_TERM_COLOR: never

# Windows PowerShell treats anything a native tool writes to stderr (cargo's progress) as an
# error, so failures are judged by exit codes, not by $ErrorActionPreference.
.rust: &rust |
  $ErrorActionPreference = 'Continue'
  $rust = Join-Path (Split-Path $env:CI_BUILDS_DIR) 'rust'
  $env:RUSTUP_HOME = Join-Path $rust 'rustup'
  $env:CARGO_HOME = Join-Path $rust 'cargo'
  $env:Path = "$env:CARGO_HOME\bin;$env:Path"
  if (-not (Test-Path "$env:CARGO_HOME\bin\cargo.exe")) {
    New-Item -ItemType Directory -Force $rust | Out-Null
    $init = Join-Path $rust 'rustup-init.exe'
    Invoke-WebRequest -UseBasicParsing https://win.rustup.rs/x86_64 -OutFile $init
    & $init -y --no-modify-path --profile minimal --default-toolchain stable --default-host x86_64-pc-windows-msvc
    if ($LASTEXITCODE -ne 0) { throw 'rustup-init failed' }
  } else {
    rustup update stable --no-self-update
    if ($LASTEXITCODE -ne 0) { Write-Host 'rustup update failed, using the installed toolchain' }
  }
  rustc --version
  if ($LASTEXITCODE -ne 0) { throw 'Rust is not available' }

check:
  stage: test
  rules:
    - if: $CI_COMMIT_TAG == null
  timeout: 90m
  script:
    - *rust
    - cargo test --locked --workspace --exclude levi
    - if ($LASTEXITCODE -ne 0) { exit 1 }
    - cargo test --locked -p levi
    - if ($LASTEXITCODE -ne 0) { exit 1 }
    - cargo build --locked --release -p yeager
    - if ($LASTEXITCODE -ne 0) { exit 1 }
  artifacts:
    name: yeager-$CI_COMMIT_SHORT_SHA
    paths: [target/release/yeager.exe]
    expire_in: 2 weeks

release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "merge_request_event"
      when: manual
      allow_failure: true
  # the signing key never touches the disk outside this job's temp folder
  script:
    - *rust
    - |
      if (-not $env:CODESIGN_PFX_BASE64 -or -not $env:CODESIGN_PFX_PASSWORD) {
        throw 'CODESIGN_PFX_BASE64 / CODESIGN_PFX_PASSWORD are not available. Make them protected variables and run on master or a protected tag.'
      }
      $pfx = Join-Path $env:TEMP "yeager-$env:CI_JOB_ID.pfx"
      [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
      try {
        & .\tools\release-gitlab.ps1 -Repo $env:CI_PROJECT_DIR -Ref $env:CI_COMMIT_SHA -PfxPath $pfx
      } finally {
        Remove-Item $pfx -Force -ErrorAction SilentlyContinue
      }
