# Yeager on GitLab.
#
# check    every push and merge request: tests and a release build, on GitLab's hosted
#          Windows runner (no runner of your own needed). Rust is installed in the job.
# release  build, sign, installer, package and publish through tools/release-gitlab.ps1.
#          Only run by hand, on master or a version tag, and only on a self-hosted Windows
#          runner tagged "yeager-windows" that has the signing tools. Without such a runner
#          it simply waits; it never fails the pipeline. Releases are normally made from a
#          developer machine with the same script (see docs/BUILD.md).
#
# Protected CI/CD variables used by the release job (Settings > CI/CD > Variables):
#   CODESIGN_PFX_BASE64    the signing PFX, base64 (masked, protected)
#   CODESIGN_PFX_PASSWORD  its password (masked, protected)
#   GITLAB_TOKEN           optional; only if the job token may not create releases
#
# levi is excluded everywhere: it is never built for or shipped with a release.

stages: [test, release]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

variables:
  GIT_DEPTH: "0"
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

check:
  stage: test
  tags: [saas-windows-medium-amd64]
  rules:
    - if: $CI_COMMIT_TAG == null
  timeout: 90m
  cache:
    key: cargo-$CI_COMMIT_REF_SLUG
    paths: [target/]
  script:
    - $ErrorActionPreference = 'Stop'
    - |
      if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
        Invoke-WebRequest -UseBasicParsing https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
        .\rustup-init.exe -y --profile minimal --default-toolchain stable --default-host x86_64-pc-windows-msvc
        if ($LASTEXITCODE -ne 0) { exit 1 }
        Remove-Item rustup-init.exe
      }
      $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
      rustc --version
    - cargo test --locked --workspace --exclude levi
    - if ($LASTEXITCODE -ne 0) { exit 1 }
    - cargo build --locked --release -p yeager
    - if ($LASTEXITCODE -ne 0) { exit 1 }
  artifacts:
    name: yeager-$CI_COMMIT_SHORT_SHA
    paths: [target/release/yeager.exe]
    expire_in: 2 weeks

release:
  stage: release
  tags: [yeager-windows]
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "merge_request_event"
      when: manual
      allow_failure: true
  # the signing key never touches the disk outside this job's temp folder
  script:
    - $ErrorActionPreference = 'Stop'
    - $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
    - if (Test-Path 'C:\Soft\w64devkit\bin') { $env:Path = "C:\Soft\w64devkit\bin;$env:Path" }
    - |
      if (-not $env:CODESIGN_PFX_BASE64 -or -not $env:CODESIGN_PFX_PASSWORD) {
        throw 'CODESIGN_PFX_BASE64 / CODESIGN_PFX_PASSWORD are not available. Make them protected variables and run on master or a protected tag.'
      }
      $pfx = Join-Path $env:TEMP "yeager-$env:CI_JOB_ID.pfx"
      [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
      try {
        & .\tools\release-gitlab.ps1 -Repo $env:CI_PROJECT_DIR -Ref $env:CI_COMMIT_SHA -PfxPath $pfx
      } finally {
        Remove-Item $pfx -Force -ErrorAction SilentlyContinue
      }
