[package]
name = "levi"
description = "Levi — High-performance Native Transport Resilience & Handshake Stabilization Engine"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "levi"
path = "src/main.rs"

[lib]
name = "levi"
path = "src/lib.rs"

[dependencies]
common.workspace = true
sha2 = "0.11"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
serde_json.workspace = true
